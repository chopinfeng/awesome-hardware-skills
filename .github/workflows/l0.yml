name: L0

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly link rot check

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python scripts/l0_check.py readme README.md
      - run: python scripts/l0_check.py links GAPS.md
      - run: python scripts/l0_check.py links CONTRIBUTING.md
      - run: python scripts/l0_check.py links EVALS.md

  translation-sync:
    # Non-English readers see the same list. An English-only PR failing here is fine:
    # a maintainer backfills the translation before or after merging.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python scripts/l0_check.py sync README.md README.zh-CN.md
      - run: python scripts/l0_check.py sync GAPS.md GAPS.zh-CN.md
      - run: python scripts/l0_check.py sync CONTRIBUTING.md CONTRIBUTING.zh-CN.md
      - run: python scripts/l0_check.py sync EVALS.md EVALS.zh-CN.md
      - run: python scripts/l0_check.py links README.zh-CN.md
      - run: python scripts/l0_check.py links GAPS.zh-CN.md
      - run: python scripts/l0_check.py links CONTRIBUTING.zh-CN.md
      - run: python scripts/l0_check.py links EVALS.zh-CN.md

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python scripts/l0_check.py skill template
