name: L2 hardware attestation
description: >-
  Report that you ran a listed skill's evals on a physical board, following the test plan in EVALS.md.
  This is the only way a skill passes.
title: "[attest] <skill-name> on <board>"
labels: ["attestation"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill and commit
      description: >-
        Repo URL (with path, if it lives in a monorepo) and the exact commit SHA you tested. The result belongs
        to that commit.
      placeholder: https://github.com/owner/repo/tree/main/skills/esp32-ble-gatt @ 3f2a9c1
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board
      description: Exact board id and revision, as named in the package's target.board.
      placeholder: esp32-c3-devkitm-1 ESP32-C3-MINI-1
    validations:
      required: true
  - type: input
    id: chip_id
    attributes:
      label: Chip unique ID
      description: >-
        The chip's unique ID used by every counted run — the MAC esptool reports for ESP32, FICR DEVICEID for nRF52,
        the 96-bit UID for STM32, or the ID picotool reports for RP2040/RP2350. It must be the same across all runs
        and self-tests.
      placeholder: "30:ed:a0:88:88:a0"
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework / SDK version
      description: Must equal the package's target.framework_version.
      placeholder: esp-idf 5.2.2
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Agent model and harness
      placeholder: claude-opus-5 via Claude Code 2.1.3, network allowed
    validations:
      required: true
  - type: textarea
    id: self_test
    attributes:
      label: Bench self-tests
      description: >-
        Phase 1. Result of flashing every task's reference solution at the start and at the end of each session,
        and for ESP32-series boards whether the eFuse summary was unchanged. Runs from a session whose closing
        self-test failed are invalid and must be rerun.
      placeholder: |
        session 2026-09-20-a  start: pass  end: pass  efuse: unchanged
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Run results
      description: >-
        Phase 2. Every run in order, including failed and invalid ones. A run passes only if every assertion held on
        the board, including ones marked l1_skippable, the reboot guard did not fire, and review found the work was
        really done. A task passes in two of at most three runs. Finish with each task's k/n, whether all its counted
        runs passed, and the pooled pass rate with its 95% Wilson interval.
      placeholder: |
        01-blink        run 1: pass   run 2: pass                                  -> task pass (2/2)
        02-gatt-notify  run 3: pass   run 4: fail (crash)   run 5: invalid (USB disconnect)   run 6: pass   -> task pass (2/3)
        pooled: 4/5 counted runs pass, 95% Wilson [0.38, 0.96]
    validations:
      required: true
  - type: textarea
    id: hardware_evidence
    attributes:
      label: Hardware evidence
      description: >-
        The flash tool's output showing the detected chip and its unique ID, and a serial log read back from the
        board. Output from a simulator or a hosted virtual board is not accepted.
      render: text
    validations:
      required: true
  - type: textarea
    id: bench_photo
    attributes:
      label: Bench photos
      description: >-
        One photo per session of the board cabled to the host, with the terminal visible. Drag the images here.
    validations:
      required: true
  - type: input
    id: records
    attributes:
      label: Run records and transcripts
      description: >-
        A commit or tag permalink — not a branch — to the directory holding every run record, its evidence files,
        the agent transcripts (unedited except secrets replaced with [REDACTED]) and a SHA256SUMS file covering all
        of them.
    validations:
      required: true
  - type: input
    id: records_digest
    attributes:
      label: SHA-256 of SHA256SUMS
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: The package's eval_validated record covers the version I tested.
          required: true
        - label: The runs were on a physical board — not a simulator and not a hosted virtual board.
          required: true
        - label: >-
            Before every run I restored the host baseline, fully reset the board, and installed the skill without
            its evals/, which the agent could not read.
          required: true
        - label: I decided which runs were invalid from bench evidence, before reading their assertion results.
          required: true
        - label: >-
            I reviewed every passing run's transcript and frozen source for faked work before counting it, and every
            run records its bench_damage.
          required: true
        - label: I reported every run, including failed and invalid ones, and did not choose which runs to count.
          required: true
        - label: >-
            I gave the agent each prompt verbatim, with no extra hints, and the transcripts are unedited except for
            secrets replaced with [REDACTED].
          required: true
